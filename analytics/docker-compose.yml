# Analytics stack: Caddy (HTTPS, website) + Umami + Postgres.
# Configuration exclusively via analytics/.env (template: .env.example).
# Only Caddy publishes ports; Umami and the database are not reachable from outside.

# Fixed project name: otherwise container and volume names depend on the folder name. Do not change it,
# or Docker creates new, empty volumes and the database seems to have disappeared.
name: straussi

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # On a real server, keep 80/443. Different ports only for the local test.
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Static files of the Astro site (contents of web/dist/), read-only.
      - ${SITE_DIR:-./site}:/srv/site:ro
      # Certificates and Caddy state survive restarts (otherwise Let's Encrypt rate limits loom).
      - caddy-data:/data
      - caddy-config:/config
    # Deliberately NO depends_on Umami: the info site should stay reachable
    # even when Umami is not running.
    logging: *logging

  umami:
    # Version deliberately pinned (same state as "latest" and "postgresql-latest").
    # To update: change the tag, then `docker compose pull && docker compose up -d`.
    image: ghcr.io/umami-software/umami:3.4.0
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/umami
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?set TWO_FACTOR_ENCRYPTION_KEY in .env}
      DISABLE_TELEMETRY: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  umami-db-data:
  caddy-data:
  caddy-config:
